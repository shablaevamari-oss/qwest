<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Собери слово по образцу</title>
<style>
:root{--ink:#26364b;--muted:#64748b;--paper:#fffdf5;--line:#e7e1d2;--green:#a9e7b5;--yellow:#ffdc75;--blue:#c8e2ff;--pink:#ffd4df}
*{box-sizing:border-box}
body{margin:0;min-height:100vh;font-family:"Trebuchet MS",system-ui,sans-serif;color:var(--ink);background:linear-gradient(135deg,#fff4c9,#dff5e7 55%,#e3efff);padding:18px}
button{font:inherit;cursor:pointer}
button:focus-visible,.letter:focus-visible,.slot:focus-visible{outline:4px solid #4389d8;outline-offset:3px}
.app{max-width:900px;margin:auto}
header{text-align:center;margin:8px auto 20px}
h1{font-size:clamp(27px,5vw,44px);margin:5px 0;color:#31445e}
.subtitle{font-size:17px;color:#53657a}
.panel{background:rgba(255,255,255,.94);border:2px solid rgba(255,255,255,.9);border-radius:25px;padding:clamp(16px,3vw,28px);box-shadow:0 8px 24px #526b8020}
.menu{display:grid;gap:15px;max-width:650px;margin:auto}
.level-btn,.main-btn{border:0;border-radius:19px;padding:19px 22px;min-height:76px;font-size:clamp(19px,3vw,24px);font-weight:900;color:#29384b;box-shadow:0 5px 0 #26364b18;transition:transform .12s}
.level-btn:hover,.main-btn:hover{transform:translateY(-2px)}
.level-btn:nth-child(1){background:var(--yellow)}.level-btn:nth-child(2){background:var(--green)}.level-btn:nth-child(3){background:var(--blue)}
.level-btn small{display:block;font-size:14px;font-weight:700;margin-top:4px}
.hidden{display:none!important}
.topbar{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px}
.small-btn{border:0;border-radius:14px;background:#e8eef7;padding:12px 17px;font-weight:800;color:#34465c}
.level-title{font-weight:900;text-align:right}
.progress-line{height:12px;border-radius:20px;background:#e9edf2;overflow:hidden;margin:10px 0 5px}
.progress-fill{height:100%;width:12.5%;background:#76c88b;border-radius:20px;transition:width .2s}
.meta{display:flex;justify-content:space-between;font-weight:800;font-size:15px}
.game-card{text-align:center;margin-top:14px}
.picture{font-size:clamp(65px,12vw,100px);line-height:1.25;margin:3px}
.instruction{font-size:14px;font-weight:800;color:var(--muted);letter-spacing:.06em}
.sample{font-size:clamp(28px,6vw,42px);font-weight:1000;letter-spacing:.12em;margin:8px 0 17px}
.slots,.tray{display:flex;justify-content:center;flex-wrap:wrap;gap:9px;min-height:62px;margin:10px auto}
.slot{width:clamp(43px,8vw,62px);height:62px;border:3px dashed #aebaca;border-radius:15px;background:#f8fafc;display:grid;place-items:center;font-size:clamp(24px,5vw,34px);font-weight:1000;touch-action:manipulation;user-select:none}
.slot.filled{border-style:solid;border-color:#80c995;background:#e8f8ec}
.slot.over{border-color:#4389d8;background:#e6f1ff}
.letter{min-width:52px;height:58px;padding:5px 12px;border:2px solid #f0c85c;border-radius:14px;background:#fff;color:#29384b;font-size:27px;font-weight:1000;box-shadow:0 4px 0 #e8d8a8;touch-action:none;user-select:none}
.letter.used{opacity:.25;box-shadow:none}
.actions{display:flex;flex-wrap:wrap;justify-content:center;gap:10px;margin-top:12px}
.main-btn{background:var(--yellow);min-height:56px;padding:13px 20px;font-size:17px;flex:1 1 160px}
.main-btn.secondary{background:#e7eef8}
.main-btn.success{background:var(--green)}
.feedback{font-size:19px;font-weight:900;min-height:30px;margin:10px 0;color:#53657a}
.finish{text-align:center}
.trophy{font-size:76px}
@media(max-width:520px){body{padding:10px}.topbar{align-items:flex-start}.panel{border-radius:20px}.slot{height:53px}.letter{height:53px;min-width:45px}.subtitle{font-size:15px}}
</style>
</head>
<body>
<main class="app">
<header>
  <div style="font-size:42px" aria-hidden="true">🌈 🧩 🍎</div>
  <h1>Собери слово по образцу</h1>
  <div class="subtitle">Весёлая игра с буквами для маленьких читателей</div>
</header>

<section id="home" class="panel">
  <h2 style="text-align:center;margin:0 0 18px">Выбери задание</h2>
  <div class="menu">
    <button class="level-btn" data-level="0">🌷 ЗАДАНИЕ 1<small>Волшебный сад · Лёгкий уровень</small></button>
    <button class="level-btn" data-level="1">🐾 ЗАДАНИЕ 2<small>Мир животных · Средний уровень</small></button>
    <button class="level-btn" data-level="2">🧸 ЗАДАНИЕ 3<small>Игрушечная страна · Сложный уровень</small></button>
  </div>
</section>

<section id="play" class="hidden">
  <div class="topbar">
    <button class="small-btn" id="homeBtn">← На главную</button>
    <div class="level-title" id="levelName"></div>
  </div>
  <div class="panel">
    <div class="meta"><span id="counter">Слово 1 из 8</span><span id="stars">⭐ 0</span></div>
    <div class="progress-line"><div class="progress-fill" id="progress"></div></div>
  </div>
  <div class="panel game-card">
    <div class="picture" id="picture" aria-hidden="true">🍎</div>
    <div class="instruction">ПОСМОТРИ НА ОБРАЗЕЦ И СОБЕРИ СЛОВО</div>
    <div class="sample" id="sample">ЯБЛОКО</div>
    <div class="slots" id="slots" aria-label="Место для букв"></div>
    <p class="instruction">ПЕРЕТАСКИВАЙ БУКВЫ В ОКОШКИ ИЛИ НАЖИМАЙ НА НИХ</p>
    <div class="tray" id="tray"></div>
    <div class="feedback" id="feedback" aria-live="polite">✨ У тебя всё получится!</div>
    <div class="actions">
      <button class="main-btn" id="checkBtn">ПРОВЕРИТЬ</button>
      <button class="main-btn secondary" id="clearBtn">ОЧИСТИТЬ</button>
      <button class="main-btn success hidden" id="nextBtn">ДАЛЬШЕ →</button>
    </div>
  </div>
</section>

<section id="finish" class="panel finish hidden">
  <div class="trophy">🏆🎉⭐</div>
  <h2>Задание выполнено!</h2>
  <p id="result" style="font-size:20px;font-weight:800"></p>
  <div class="actions">
    <button class="main-btn" id="againBtn">ПОВТОРИТЬ</button>
    <button class="main-btn secondary" id="finishHomeBtn">НА ГЛАВНУЮ</button>
  </div>
</section>
</main>

<script>
(() => {
  const tasks = [
    {name:"🌷 Волшебный сад", words:[
      ["🍎","ЯБЛОКО"],["🍐","ГРУША"],["🌹","РОЗА"],["🌷","ТЮЛЬПАН"],
      ["🍋","ЛИМОН"],["🍒","ВИШНЯ"],["🍓","КЛУБНИКА"],["🌼","РОМАШКА"]
    ]},
    {name:"🐾 Мир животных", words:[
      ["🐱","КОТ"],["🐶","СОБАКА"],["🐻","МЕДВЕДЬ"],["🦊","ЛИСА"],
      ["🐰","ЗАЯЦ"],["🐘","СЛОН"],["🐸","ЛЯГУШКА"],["🐯","ТИГР"]
    ]},
    {name:"🧸 Игрушечная страна", words:[
      ["⚽","МЯЧ"],["🪆","КУКЛА"],["🚗","МАШИНА"],["🧸","МИШКА"],
      ["🚂","ПАРОВОЗ"],["🥁","БАРАБАН"],["🪀","ЮЛА"],["🧩","ПАЗЛЫ"]
    ]}
  ];
  const $ = id => document.getElementById(id);
  let level=0, index=0, score=0, word="", letters=[], slots=[], locked=false, dragged=null;

  function show(screen){
    ["home","play","finish"].forEach(id => $(id).classList.toggle("hidden", id!==screen));
  }
  function shuffle(text){
    const a=[...text];
    for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]];}
    if(a.join("")===text && a.length>1) [a[0],a[1]]=[a[1],a[0]];
    return a;
  }
  function start(n){
    level=n;index=0;score=0;
    $("levelName").textContent=tasks[level].name;
    show("play");render();
  }
  function render(){
    locked=false;dragged=null;
    const [picture,text]=tasks[level].words[index];
    word=text;
    letters=shuffle(word).map((char,id)=>({id,char,used:false}));
    slots=Array(word.length).fill(null);
    $("picture").textContent=picture;
    $("sample").textContent=word;
    $("counter").textContent=`Слово ${index+1} из 8`;
    $("stars").textContent=`⭐ ${score}`;
    $("progress").style.width=`${(index+1)/8*100}%`;
    $("feedback").textContent="✨ У тебя всё получится!";
    $("feedback").style.color="#53657a";
    $("checkBtn").classList.remove("hidden");
    $("nextBtn").classList.add("hidden");
    draw();
  }
  function putLetter(id,slotIndex){
    if(locked || letters[id].used) return;
    if(slots[slotIndex]!==null) letters[slots[slotIndex]].used=false;
    slots[slotIndex]=id;letters[id].used=true;draw();
  }
  function draw(){
    $("slots").innerHTML="";
    slots.forEach((id,i)=>{
      const cell=document.createElement("button");
      cell.type="button";cell.className="slot"+(id!==null?" filled":"");
      cell.textContent=id===null?"":letters[id].char;
      cell.setAttribute("aria-label",`Ячейка ${i+1}. Нажми, чтобы убрать букву`);
      cell.addEventListener("click",()=>{
        if(locked || slots[i]===null)return;
        letters[slots[i]].used=false;slots[i]=null;draw();
      });
      cell.addEventListener("dragover",e=>{e.preventDefault();cell.classList.add("over");});
      cell.addEventListener("dragleave",()=>cell.classList.remove("over"));
      cell.addEventListener("drop",e=>{
        e.preventDefault();cell.classList.remove("over");
        const id=Number(e.dataTransfer.getData("text/plain"));
        if(Number.isInteger(id))putLetter(id,i);
      });
      $("slots").appendChild(cell);
    });
    $("tray").innerHTML="";
    letters.forEach(letter=>{
      const btn=document.createElement("button");
      btn.type="button";btn.className="letter"+(letter.used?" used":"");
      btn.textContent=letter.char;btn.disabled=letter.used||locked;
      btn.draggable=!letter.used&&!locked;
      btn.setAttribute("aria-label",`Буква ${letter.char}`);
      btn.addEventListener("click",()=>{
        if(locked||letter.used)return;
        const firstEmpty=slots.indexOf(null);
        if(firstEmpty!==-1)putLetter(letter.id,firstEmpty);
      });
      btn.addEventListener("dragstart",e=>{
        dragged=letter.id;e.dataTransfer.setData("text/plain",String(letter.id));
        e.dataTransfer.effectAllowed="move";
      });
      $("tray").appendChild(btn);
    });
  }
  $("checkBtn").addEventListener("click",()=>{
    if(slots.some(x=>x===null)){
      $("feedback").textContent="💛 Заполни все окошки!";return;
    }
    const answer=slots.map(id=>letters[id].char).join("");
    if(answer===word){
      locked=true;score++;
      $("stars").textContent=`⭐ ${score}`;
      $("feedback").textContent="🎉 Молодец! Правильно!";
      $("feedback").style.color="#238449";
      $("checkBtn").classList.add("hidden");
      $("nextBtn").classList.remove("hidden");
      draw();
    }else{
      $("feedback").textContent="🌟 Не совсем так. Попробуй ещё раз!";
      $("feedback").style.color="#b36b13";
    }
  });
  $("clearBtn").addEventListener("click",()=>{
    if(locked)return;
    letters.forEach(x=>x.used=false);slots=Array(word.length).fill(null);
    $("feedback").textContent="Попробуй собрать слово ещё раз!";
    draw();
  });
  $("nextBtn").addEventListener("click",()=>{
    if(index<7){index++;render();}
    else{
      $("result").textContent=`Ты правильно собрал(а) ${score} из 8 слов!`;
      show("finish");
    }
  });
  $("homeBtn").addEventListener("click",()=>show("home"));
  $("finishHomeBtn").addEventListener("click",()=>show("home"));
  $("againBtn").addEventListener("click",()=>start(level));
  document.querySelectorAll("[data-level]").forEach(btn=>btn.addEventListener("click",()=>start(Number(btn.dataset.level))));
})();
</script>
</body>
</html>
